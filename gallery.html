<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pixel → Voxel - Gallery Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script defer src="public/shared/hxr-header.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(900px 520px at 70% 25%, rgba(101, 155, 166, 0.35), rgba(101, 155, 166, 0) 60%),
                radial-gradient(820px 520px at 32% 78%, rgba(112, 89, 144, 0.32), rgba(112, 89, 144, 0) 62%),
                linear-gradient(135deg, #08070c 0%, #18161f 38%, #1e2638 66%, #1e3540 100%),
                repeating-linear-gradient(135deg, rgba(0,0,0,0.06) 0 2px, rgba(0,0,0,0) 2px 7px);
            background-attachment: fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        canvas { display: block; }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.9) 100%);
        }
        .ui-panel {
            position: absolute;
            bottom: 40px;
            left: 40px;
            pointer-events: none;
            z-index: 10;
        }
        .info-card {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(5, 10, 15, 0.95);
            border: 1px solid rgba(34, 211, 238, 0.12);
            padding: 2rem;
            box-shadow: 0px 12px 32px rgba(0,0,0,0.35);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            max-width: 400px;
            backdrop-filter: blur(20px);
            z-index: 100;
            pointer-events: auto;
        }
        .info-card.active {
            opacity: 1; visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        .close-btn {
            position: absolute;
            top: 1rem; right: 1rem;
            cursor: pointer;
            color: rgba(34, 211, 238, 0.55);
            transition: color 0.3s;
        }
        .close-btn:hover {
            color: rgba(34, 211, 238, 1);
        }
        .mode-toggle {
            position: absolute;
            top: calc(20px + var(--hxr-header-safe-top, 0px));
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .mode-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(34, 211, 238, 0.25);
        }
        .voice-search {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .voice-btn {
            background: #22D3EE;
            color: #000;
            border: 1px solid rgba(0,0,0,0.08);
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .voice-btn:hover {
            background: #22D3EE;
            filter: brightness(0.92);
        }
        .voice-btn.listening {
            background: #ff4444;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .search-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #fff;
            padding: 8px 12px;
            width: 200px;
        }
        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        /* Info card & UI panel (replaces Tailwind utilities) */
        .ui-panel__title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #22D3EE;
        }
        .ui-panel__subtitle {
            font-size: 7px;
            color: rgba(34, 211, 238, 0.7);
            margin-top: 0.5rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: ui-monospace, monospace;
        }
        .info-card {
            font-family: ui-monospace, monospace;
        }
        .info-card__title {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #22D3EE;
        }
        .info-card__meta {
            font-size: 7px;
            color: rgba(34, 211, 238, 0.8);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        .info-card__img-wrap {
            width: 100%;
            aspect-ratio: 1;
            margin-bottom: 1rem;
            overflow: hidden;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
        }
        .info-card__img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-card__desc {
            font-size: 8px;
            color: rgba(34, 211, 238, 0.7);
            line-height: 1.625;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .info-card__btn {
            width: 100%;
            padding: 0.5rem 1rem;
            background: #22D3EE;
            color: #000;
            font-weight: 700;
            border: 1px solid rgba(0, 0, 0, 0.06);
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .ui-panel {
                bottom: calc(20px + env(safe-area-inset-bottom));
                left: 16px;
            }
            .ui-panel__title { font-size: 0.9rem; letter-spacing: 0.3em; }
            .ui-panel__subtitle { font-size: 6px; }
            .mode-toggle {
                top: calc(12px + var(--hxr-header-safe-top, 0px));
                right: 12px;
                padding: 8px 14px;
                font-size: 12px;
            }
            .voice-search {
                bottom: calc(20px + env(safe-area-inset-bottom));
                right: 16px;
                padding: 8px 12px;
                gap: 8px;
            }
            .search-input { width: 140px; padding: 6px 10px; font-size: 13px; }
            .voice-btn { padding: 6px 12px; font-size: 12px; }
            .info-card {
                max-width: calc(100vw - 32px);
                padding: 1.25rem;
                transform: translate(-50%, -50%) scale(0.95);
            }
            .info-card.active { transform: translate(-50%, -50%) scale(1); }
            .info-card__title { font-size: 1rem; }
            .info-card__meta { font-size: 6px; margin-bottom: 0.75rem; }
            .info-card__img-wrap { margin-bottom: 0.75rem; }
            .info-card__desc { font-size: 7px; margin-bottom: 0.75rem; }
            .info-card__btn { padding: 10px 1rem; font-size: 13px; }
            .close-btn { top: 0.75rem; right: 0.75rem; font-size: 11px; }
        }
    </style>
</head>
<body>
    <hxr-header current="mapping" mode="overlay"></hxr-header>

    <div class="voice-search">
        <input type="text" class="search-input" id="searchInput" placeholder="Search by author or title...">
        <button class="voice-btn" id="voiceBtn">Voice</button>
    </div>

    <div class="overlay"></div>
    <div class="ui-panel">
        <h1 class="ui-panel__title">Pixel → Voxel</h1>
        <p class="ui-panel__subtitle">Gallery Mode // Spherical Nebula</p>
    </div>

    <div id="infoCard" class="info-card">
        <div class="close-btn" onclick="hideDetails()">[ CLOSE ]</div>
        <h2 class="info-card__title" id="cardTitle">NODE_DATA</h2>
        <p class="info-card__meta" id="cardMeta">ENCODED_BLOCK_STATUS_OK</p>
        <div class="info-card__img-wrap">
            <img id="cardImg" src="" alt="Detail">
        </div>
        <p class="info-card__desc" id="cardDesc">Neural mapping completed.</p>
        <button onclick="goToViewer()" class="info-card__btn">Enter Viewer Mode</button>
    </div>

    <script>
        let scene, camera, renderer, raycaster, mouse;
        const imagePlanes = [];
        const clock = new THREE.Clock();
        const sphereGroup = new THREE.Group();
        let models = [];
        let currentModelData = null;

        // Pixelation + grayscale/color mix shader
        const pixelShader = {
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float pixelSize;
                uniform float colorMix;
                uniform float opacity;
                varying vec2 vUv;
               
                void main() {
                    vec2 d = vec2(1.0 / 800.0, 1.0 / 600.0) * pixelSize;
                    vec2 uv = vec2(floor(vUv.x / d.x) * d.x, floor(vUv.y / d.y) * d.y);
                    vec4 texel = texture2D(tDiffuse, uv);
                   
                    float gray = dot(texel.rgb, vec3(0.299, 0.587, 0.114));
                    float contrastGray = smoothstep(0.1, 0.9, gray);
                    float brightGray = contrastGray * 1.35;
                    vec3 grayColor = vec3(brightGray);
                    vec3 finalColor = mix(grayColor, texel.rgb, colorMix);
                   
                    gl_FragColor = vec4(finalColor, opacity);
                }
            `
        };

        function fixPath(path) {
            if (path.startsWith('/assets/')) {
                return './public' + path;
            }
            return path;
        }

        const PLACEHOLDER_EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp'];

        function loadTextureWithFallback(loader, basePath, onLoad) {
            let i = 0;
            function tryNext() {
                if (i >= PLACEHOLDER_EXTENSIONS.length) {
                    onLoad(null);
                    return;
                }
                const url = basePath + '.' + PLACEHOLDER_EXTENSIONS[i++];
                loader.load(url, onLoad, undefined, tryNext);
            }
            tryNext();
        }

        function isPlaceholderBasePath(thumbPath) {
            return thumbPath && /^public\/placeholders\/\d+$/.test(thumbPath);
        }

        async function loadModels() {
            try {
                const paths = ['./public/data/models.json', 'public/data/models.json', '/public/data/models.json'];
                let response;
                for (const path of paths) {
                    try {
                        response = await fetch(path);
                        if (response && response.ok) break;
                    } catch (e) {
                        continue;
                    }
                }
                if (!response || !response.ok) {
                    throw new Error('Failed to load models.json');
                }
                const data = await response.json();
                models = data.models || [];
                let indices = Array.from({ length: 29 }, (_, i) => i + 1);
                let extensions = {};
                try {
                    const man = await fetch('./public/placeholders/manifest.json');
                    if (man && man.ok) {
                        const m = await man.json();
                        if (m && m.indices && m.indices.length) indices = m.indices;
                        if (m && m.extensions) extensions = m.extensions;
                    }
                } catch (e) {}
                const placeholderItems = indices.map(n => ({
                    id: 'placeholder-' + n,
                    title: 'Placeholder ' + n,
                    thumbPath: 'public/placeholders/' + n,
                    thumbExt: extensions[String(n)] || null
                }));
                const allItems = [...models, ...placeholderItems];
                if (allItems.length === 0) {
                    console.warn('No models or placeholders');
                    return;
                }
                models = allItems;
                init();
            } catch (error) {
                console.error('Error loading models:', error);
            }
        }

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000508, 0.025);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 60 / 2.4; // 2.4x zoom

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setClearColor(0x000000, 0);
            document.body.appendChild(renderer.domElement);

            scene.add(sphereGroup);
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Wireframe sphere (glow)
            const gridSphereGeo = new THREE.SphereGeometry(25 - 0.5, 32, 32);
            const gridSphereMat = new THREE.MeshBasicMaterial({
                color: 0x22D3EE,
                wireframe: true,
                transparent: true,
                opacity: 0.18,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const gridSphere = new THREE.Mesh(gridSphereGeo, gridSphereMat);
            sphereGroup.add(gridSphere);
            // Glow halo (slightly larger, softer)
            const glowGeo = new THREE.SphereGeometry(25 - 0.3, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0x22D3EE,
                wireframe: true,
                transparent: true,
                opacity: 0.06,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const glowSphere = new THREE.Mesh(glowGeo, glowMat);
            sphereGroup.add(glowSphere);

            // Point shell sphere
            const dotGeo = new THREE.SphereGeometry(25 - 0.4, 64, 32);
            const dotMat = new THREE.PointsMaterial({
                color: 0x22D3EE,
                size: 0.12,
                transparent: true,
                opacity: 0.25
            });
            const dots = new THREE.Points(dotGeo, dotMat);
            sphereGroup.add(dots);

            // Background particles
            const starGeo = new THREE.BufferGeometry();
            const starPos = new Float32Array(2500 * 3);
            for(let i=0; i<2500*3; i++) starPos[i] = (Math.random() - 0.5) * 350;
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0x004444, size: 0.12 })));

            const loader = new THREE.TextureLoader();
            const radius = 25;

            const dummyTex = new THREE.DataTexture(new Uint8Array([64, 64, 64, 255]), 1, 1);
            dummyTex.needsUpdate = true;
            // Pure black texture for "pixel" items (non-placeholder thumbs)
            const blackTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1);
            blackTex.needsUpdate = true;

            models.forEach((model, i) => {
                const n = models.length;
                const phi = Math.acos(-1 + (2 * i) / n);
                const theta = Math.sqrt(n * Math.PI) * phi;

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                const geometry = new THREE.PlaneGeometry(5.2, 3.9);
                const thumbPath = fixPath(model.thumbPath);
                const isPlaceholder = isPlaceholderBasePath(model.thumbPath);
                const placeholderUrl = isPlaceholder && model.thumbExt ? thumbPath + '.' + model.thumbExt : thumbPath;
                // Keep the original pixel shader + hover reveal behavior.
                // Only change: non-placeholder thumbs sample from a black texture.
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        tDiffuse: { value: isPlaceholder ? dummyTex : blackTex },
                        pixelSize: { value: 45.0 },
                        colorMix: { value: 0.0 },
                        opacity: { value: 0.55 }
                    },
                    vertexShader: pixelShader.vertexShader,
                    fragmentShader: pixelShader.fragmentShader,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                if (isPlaceholder) {
                    if (model.thumbExt) {
                        loader.load(placeholderUrl, function(tex) {
                            if (tex) material.uniforms.tDiffuse.value = tex;
                        });
                    } else {
                        loadTextureWithFallback(loader, thumbPath, function(tex) {
                            if (tex) material.uniforms.tDiffuse.value = tex;
                        });
                    }
                }

                const plane = new THREE.Mesh(geometry, material);
                plane.position.set(x, y, z);
                plane.lookAt(0, 0, 0);
               
                plane.userData = {
                    id: model.id,
                    modelData: model,
                    isPlaceholder: isPlaceholder,
                    originalPos: plane.position.clone()
                };
               
                imagePlanes.push(plane);
                sphereGroup.add(plane);
            });

            window.addEventListener('resize', onWindowResize);

            // Use pointer events so both mouse + touch work
            window.addEventListener('pointermove', onPointerMove, { passive: true });
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointerup', onPointerUp);

            // Fallback for older browsers
            window.addEventListener('touchmove', onTouchMove, { passive: true });
            window.addEventListener('touchstart', onTouchStart, { passive: true });
            window.addEventListener('touchend', onTouchEnd, { passive: false });

            window.addEventListener('wheel', onWheel, { passive: true });

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        // Mobile-friendly pointer/touch support
        let touchStartX = 0, touchStartY = 0;
        let touchStartRotY = 0, touchStartRotZ = 0;
        let touchStartDist = 0;
        let touchStartZ = 0;
        let isDragging = false;
        let isTouching = false;

        function setPointerFromEvent(event) {
            const e = (event && event.touches && event.touches.length) ? event.touches[0] : event;
            if (!e) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        function onPointerMove(event) {
            setPointerFromEvent(event);
        }

        function onPointerDown(event) {
            setPointerFromEvent(event);
            if (!event.touches) onMouseDown();
        }

        function onPointerUp(event) {
            if (!event.touches) isDragging = false;
        }

        function touchDist(touches) {
            if (!touches || touches.length < 2) return 0;
            const a = touches[0], b = touches[1];
            return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
        }

        function onTouchStart(event) {
            isTouching = true;
            touchStartX = event.touches[0].clientX;
            touchStartY = event.touches[0].clientY;
            touchStartRotY = sphereGroup.rotation.y;
            touchStartRotZ = sphereGroup.rotation.z;
            touchStartDist = touchDist(event.touches);
            touchStartZ = camera.position.z;
            isDragging = false;
            setPointerFromEvent(event);
        }

        function onTouchMove(event) {
            const d = touchDist(event.touches);
            if (d > 0 && touchStartDist > 0) {
                const scale = touchStartDist / d;
                camera.position.z = Math.max(8, Math.min(150, touchStartZ * scale));
            } else if (event.touches.length === 1) {
                const dx = event.touches[0].clientX - touchStartX;
                const dy = event.touches[0].clientY - touchStartY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
                sphereGroup.rotation.y = touchStartRotY + dx * 0.01;
                sphereGroup.rotation.z = touchStartRotZ + dy * 0.005;
            }
            setPointerFromEvent(event);
        }

        function onTouchEnd(event) {
            isTouching = false;
            if (!isDragging && event.changedTouches && event.changedTouches[0]) {
                mouse.x = (event.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(imagePlanes);
                if (intersects.length > 0) {
                    showDetails(intersects[0].object.userData.modelData);
                }
            }
        }

        function onWheel(event) {
            camera.position.z += event.deltaY * 0.05;
            camera.position.z = Math.max(8, Math.min(camera.position.z, 150));
        }

        function onMouseDown() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(imagePlanes);
            if (intersects.length > 0) {
                showDetails(intersects[0].object.userData.modelData);
            }
        }

        function setImgWithFallback(imgEl, basePath) {
            if (!imgEl || !basePath) return;
            const path = fixPath(basePath);
            let i = 0;
            function tryNext() {
                if (i >= PLACEHOLDER_EXTENSIONS.length) return;
                imgEl.src = path + '.' + PLACEHOLDER_EXTENSIONS[i++];
                imgEl.onerror = tryNext;
            }
            imgEl.onload = function() { imgEl.onerror = null; };
            tryNext();
        }

        function showDetails(modelData) {
            currentModelData = modelData;
            const card = document.getElementById('infoCard');
            document.getElementById('cardTitle').innerText = modelData.title;
            document.getElementById('cardMeta').innerText = modelData.author ? `by ${modelData.author} | ID: ${modelData.id}` : `ID: ${modelData.id}`;
            const cardImg = document.getElementById('cardImg');
            if (isPlaceholderBasePath(modelData.thumbPath)) {
                if (modelData.thumbExt) {
                    cardImg.src = fixPath(modelData.thumbPath) + '.' + modelData.thumbExt;
                } else {
                    setImgWithFallback(cardImg, modelData.thumbPath);
                }
            } else {
                cardImg.src = fixPath(modelData.thumbPath);
            }
            document.getElementById('cardDesc').innerText = `Click the button to enter viewer mode and experience the full 3D model.`;
            card.classList.add('active');
        }

        function hideDetails() {
            document.getElementById('infoCard').classList.remove('active');
        }

        function goToViewer() {
            if (currentModelData) {
                window.location.href = `viewer.html?id=${currentModelData.id}`;
            } else {
                window.location.href = 'viewer.html';
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Slower auto-rotation (pause during touch drag)
            if (!isTouching) {
                sphereGroup.rotation.y += 0.0006;
                sphereGroup.rotation.z += 0.0002;
            }

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(imagePlanes);
            const hoveredObj = intersects.length > 0 ? intersects[0].object : null;

            imagePlanes.forEach((plane) => {
                const offset = Math.sin(time * 0.9 + plane.userData.id.charCodeAt(0)) * 0.45;
                const dir = plane.position.clone().normalize();
                plane.position.copy(plane.userData.originalPos).add(dir.multiplyScalar(offset));

                if (plane === hoveredObj) {
                    plane.material.uniforms.pixelSize.value = THREE.MathUtils.lerp(plane.material.uniforms.pixelSize.value, 1.0, 0.12);
                    plane.material.uniforms.colorMix.value = THREE.MathUtils.lerp(plane.material.uniforms.colorMix.value, 1.0, 0.12);
                    plane.material.uniforms.opacity.value = THREE.MathUtils.lerp(plane.material.uniforms.opacity.value, 1.0, 0.12);
                    plane.scale.lerp(new THREE.Vector3(1.2, 1.2, 1.2), 0.12);
                } else {
                    plane.material.uniforms.pixelSize.value = THREE.MathUtils.lerp(plane.material.uniforms.pixelSize.value, 45.0, 0.05);
                    plane.material.uniforms.colorMix.value = THREE.MathUtils.lerp(plane.material.uniforms.colorMix.value, 0.0, 0.05);
                    plane.material.uniforms.opacity.value = THREE.MathUtils.lerp(plane.material.uniforms.opacity.value, 0.55, 0.05);
                    plane.scale.lerp(new THREE.Vector3(1, 1, 1), 0.08);
                }
            });

            camera.lookAt(0, 0, 0);
            renderer.render(scene, camera);
        }

        // Voice Search
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.toLowerCase();
                searchByAuthor(transcript);
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('voiceBtn').classList.remove('listening');
            };
        }

        document.getElementById('voiceBtn').addEventListener('click', () => {
            if (!recognition) {
                alert('Your browser does not support speech recognition.');
                return;
            }

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
            }
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchByAuthor(e.target.value);
            }
        });

        function searchByAuthor(query) {
            const q = (query || '').toLowerCase();
            const found = models.find(m => {
                const a = (m && m.author ? String(m.author) : '').toLowerCase();
                const t = (m && m.title ? String(m.title) : '').toLowerCase();
                return a.includes(q) || t.includes(q);
            });

            if (found) {
                const index = models.findIndex(m => m.id === found.id);
                const phi = Math.acos(-1 + (2 * index) / models.length);
                const theta = Math.sqrt(models.length * Math.PI) * phi;
                
                const targetX = 25 * Math.sin(phi) * Math.cos(theta);
                const targetY = 25 * Math.sin(phi) * Math.sin(theta);
                const targetZ = 25 * Math.cos(phi);

                const animateToTarget = () => {
                    camera.position.x += (targetX - camera.position.x) * 0.05;
                    camera.position.y += (targetY - camera.position.y) * 0.05;
                    camera.position.z += (targetZ + 30 - camera.position.z) * 0.05;
                    
                    if (Math.abs(camera.position.x - targetX) > 0.1) {
                        requestAnimationFrame(animateToTarget);
                    }
                };
                animateToTarget();

                showDetails(found);
            } else {
                alert('No matching model found.');
            }
        }

        window.onload = loadModels;
    </script>
</body>
</html>
