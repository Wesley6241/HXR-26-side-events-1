<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel → Voxel - Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px solid #333;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 60px;
            color: #ff4444;
            background: #2a1a1a;
            border: 1px solid rgba(255,68,68,0.12);
            margin: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .model-card {
            background: #1a1a1a;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .model-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.25);
            border-color: rgba(102, 126, 234, 0.25);
        }

        .model-thumb {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #0f0f0f;
        }

        .model-info {
            padding: 20px;
        }

        .model-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .model-author {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 12px;
        }

        .model-id {
            color: #555;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
        }

        .viewer-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
        }

        .viewer-container.active {
            display: block;
        }

        .viewer-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            z-index: 1001;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .viewer-title {
            font-size: 1.5em;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #fff;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .viewer-canvas {
            width: 100%;
            height: 100%;
        }

        .viewer-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 0, 0, 0.2);
            color: #fff;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        .stats {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pixel → Voxel</h1>
            <p class="subtitle">3D Model Gallery Test</p>
        </header>

        <div id="loading" class="loading">
            <p>Loading models...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>Failed to load models. Please check if models.json exists.</p>
        </div>

        <div id="stats" class="stats" style="display: none;"></div>
        <div id="gallery" class="gallery" style="display: none;"></div>
    </div>

    <div id="viewer" class="viewer-container">
        <div class="viewer-header">
            <div class="viewer-title" id="viewer-title">Loading...</div>
            <button class="close-btn" onclick="closeViewer()">Close (ESC)</button>
        </div>
        <canvas id="viewer-canvas" class="viewer-canvas"></canvas>
        <div class="viewer-controls">
            <button class="control-btn" onclick="resetCamera()">Reset Camera</button>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let models = [];
        let scene, camera, renderer, controls;
        let currentModel = null;

        // Load models.json
        async function loadModels() {
            try {
                // Try different possible paths
                let response;
                const paths = [
                    './public/data/models.json',
                    'public/data/models.json',
                    '/public/data/models.json',
                    '../public/data/models.json'
                ];
                
                for (const path of paths) {
                    try {
                        response = await fetch(path);
                        if (response && response.ok) break;
                    } catch (e) {
                        continue;
                    }
                }
                if (!response || !response.ok) {
                    throw new Error('Failed to load models.json - tried multiple paths');
                }
                const data = await response.json();
                models = data.models || [];
                
                document.getElementById('loading').style.display = 'none';
                
                if (models.length === 0) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').innerHTML = '<p>No models found in models.json</p>';
                    return;
                }

                document.getElementById('stats').style.display = 'block';
                document.getElementById('stats').textContent = `Found ${models.length} model(s)`;
                document.getElementById('gallery').style.display = 'grid';
                renderGallery();
            } catch (error) {
                console.error('Error loading models:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        }

        // Fix path - convert /assets/ to public/assets/ if needed
        function fixPath(path) {
            if (path.startsWith('/assets/')) {
                // Try public/assets/ first
                return './public' + path;
            }
            return path;
        }

        // Render gallery
        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            models.forEach(model => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.onclick = () => openViewer(model);

                const thumbPath = fixPath(model.thumbPath);
                card.innerHTML = `
                    <img src="${thumbPath}" alt="${model.title}" class="model-thumb" 
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22280%22%3E%3Crect fill=%22%23111%22 width=%22280%22 height=%22280%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-family=%22sans-serif%22 font-size=%2214%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                    <div class="model-info">
                        <div class="model-title">${escapeHtml(model.title)}</div>
                        <div class="model-author">by ${escapeHtml(model.author)}</div>
                        <div class="model-id">ID: ${model.id}</div>
                    </div>
                `;

                gallery.appendChild(card);
            });
        }

        // Open 3D viewer
        function openViewer(model) {
            currentModel = model;
            const viewer = document.getElementById('viewer');
            const title = document.getElementById('viewer-title');
            
            title.textContent = `${model.title} by ${model.author}`;
            viewer.classList.add('active');

            initViewer();
            loadGLB(model.glbPath);
        }

        // Close viewer
        function closeViewer() {
            const viewer = document.getElementById('viewer');
            viewer.classList.remove('active');
            
            if (renderer) {
                renderer.dispose();
            }
            if (controls) {
                controls.dispose();
            }
        }

        // Initialize Three.js scene
        function initViewer() {
            const canvas = document.getElementById('viewer-canvas');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1;
            controls.maxDistance = 20;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight1.position.set(5, 5, 5);
            scene.add(directionalLight1);

            const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            directionalLight2.position.set(-5, -5, -5);
            scene.add(directionalLight2);

            // Grid helper
            const gridHelper = new THREE.GridHelper(10, 10, 0x333333, 0x222222);
            scene.add(gridHelper);

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // Handle window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // Load GLB model
        function loadGLB(path) {
            const loader = new THREE.GLTFLoader();
            
            // Clear existing model
            scene.children.forEach(child => {
                if (child.type === 'Group' || child.type === 'Mesh') {
                    scene.remove(child);
                }
            });

            // Fix path for GLB file
            const glbPath = fixPath(path);
            loader.load(
                glbPath,
                (gltf) => {
                    const model = gltf.scene;
                    
                    // Calculate bounding box
                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    
                    // Center the model
                    model.position.sub(center);
                    
                    // Scale to fit
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 3 / maxDim;
                    model.scale.multiplyScalar(scale);
                    
                    scene.add(model);
                },
                (progress) => {
                    console.log('Loading progress:', (progress.loaded / progress.total * 100) + '%');
                },
                (error) => {
                    console.error('Error loading GLB:', error);
                    alert('Failed to load model: ' + error.message);
                }
            );
        }

        // Reset camera
        function resetCamera() {
            if (camera && controls) {
                camera.position.set(0, 0, 5);
                controls.target.set(0, 0, 0);
                controls.update();
            }
        }

        // Escape key to close viewer
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeViewer();
            }
        });

        // Utility: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load models on page load
        loadModels();
    </script>
</body>
</html>
